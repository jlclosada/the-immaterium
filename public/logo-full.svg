<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 52" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left decorative element: angular bracket -->
  <path d="M8 12 L2 26 L8 40" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M14 16 L10 26 L14 36" stroke="#00d4ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Diamond ornament left -->
  <rect x="16" y="23" width="5" height="5" transform="rotate(45 18.5 25.5)" fill="#00d4ff" opacity="0.6"/>

  <!-- Top decorative line -->
  <line x1="26" y1="10" x2="294" y2="10" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.4"/>
  <!-- Bottom decorative line -->
  <line x1="26" y1="42" x2="294" y2="42" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- Main title: THE IMMATERIUM -->
  <text
    x="162"
    y="32"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Orbitron', 'Rajdhani', 'Arial', sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="5"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >THE IMMATERIUM</text>

  <!-- Subtitle: thin line below -->
  <text
    x="162"
    y="42"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Orbitron', 'Arial', sans-serif"
    font-size="5.5"
    font-weight="400"
    letter-spacing="6"
    fill="#00d4ff"
    opacity="0.45"
  >COMUNIDAD WARHAMMER 40K</text>

  <!-- Diamond ornament right -->
  <rect x="298" y="23" width="5" height="5" transform="rotate(45 300.5 25.5)" fill="#7b2fff" opacity="0.6"/>

  <!-- Right decorative element -->
  <path d="M306 16 L310 26 L306 36" stroke="#7b2fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M312 12 L318 26 L312 40" stroke="#7b2fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
